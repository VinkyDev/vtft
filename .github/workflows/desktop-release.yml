name: 构建并发布桌面应用

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 packages
        run: pnpm run build:packages

      - name: 构建 Windows 应用
        run: pnpm run build:win

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            apps/electron/dist/*-setup.exe
            apps/electron/dist/*.exe.blockmap
            apps/electron/dist/latest.yml
          retention-days: 7

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 packages
        run: pnpm run build:packages

      - name: 构建 macOS 应用
        run: pnpm run build:mac

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            apps/electron/dist/*.dmg
            apps/electron/dist/*.dmg.blockmap
            apps/electron/dist/latest-mac.yml
          retention-days: 7

  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载 Windows 构建产物
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: ./release-assets

      - name: 下载 macOS 构建产物
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: ./release-assets

      - name: 生成安装说明
        id: release-notes
        run: |
          cat << 'EOF' > release-body.md
          ## 📦 安装说明

          ### Windows 用户
          1. 下载 `VTFT-Setup-{version}.exe` 文件
          2. 双击运行安装程序, 按照向导完成安装

          ### macOS 用户
          1. 下载 `VTFT-{version}.dmg` 文件
          2. 双击打开 DMG 文件后, 将 VTFT 图标拖拽到 Applications 文件夹
          3. 首次打开时，如果系统提示"无法验证开发者"，请：
             - 打开"系统偏好设置" > "安全性与隐私" > "通用"
             - 点击"仍要打开"按钮
          ---

          EOF

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-assets/*
          body_path: release-body.md
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
