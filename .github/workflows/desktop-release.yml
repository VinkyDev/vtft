name: 构建并发布桌面应用

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 packages
        run: pnpm run build:packages

      - name: 构建 Windows 应用
        run: pnpm run build:win

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            apps/electron/dist/*.exe
            apps/electron/dist/*.exe.blockmap
            apps/electron/dist/*-x64.zip
            apps/electron/dist/*-arm64.zip
            apps/electron/dist/*.zip.blockmap
          retention-days: 7

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 packages
        run: pnpm run build:packages

      - name: 构建 macOS 应用
        run: pnpm run build:mac

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            apps/electron/dist/*.dmg
            apps/electron/dist/*.dmg.blockmap
            apps/electron/dist/*-arm64.zip
            apps/electron/dist/*.zip.blockmap
          retention-days: 7

  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载 Windows 构建产物
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: ./release-assets

      - name: 下载 macOS 构建产物
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: ./release-assets

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
